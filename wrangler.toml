# Cloudflare Pages configuration
# Used by: wrangler pages dev  (local development)
# Production bindings are configured in the Cloudflare Dashboard:
#  Pages > <project> > Settings > Functions > KV namespace bindings

name = "swr-dashboard"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# ──────────────────────────────────────────────────────────────────────────────
# KV Namespace Bindings
# Replace the 'id' values with your actual KV namespace IDs from the dashboard.
# For local dev, wrangler creates ephemeral local KV stores automatically when
# the IDs are set to any placeholder string.
# ──────────────────────────────────────────────────────────────────────────────

[[kv_namespaces]]
binding  = "OVERLAYS_KV"
id       = "660381d7f93e42a887c203b0e89a1e4a"

[[kv_namespaces]]
binding  = "SETTINGS_KV"
id       = "2ed469f119304a8f8a204f5ec8b61252"

[[kv_namespaces]]
binding  = "STANDORTE_KV"
id       = "e87705c3c7524995a4ccfe3c60b21b7a"

# [vars]
# ADMIN_SECRET is hidden, find it

# ──────────────────────────────────────────────────────────────────────────────
# Preview / Staging Environment
# Used for all dev/staging builds
# ──────────────────────────────────────────────────────────────────────────────

[env.preview]
[[env.preview.kv_namespaces]]
binding  = "OVERLAYS_KV"
id       = "REPLACE_WITH_STAGING_OVERLAYS_KV_ID"

[[env.preview.kv_namespaces]]
binding  = "SETTINGS_KV"
id       = "REPLACE_WITH_STAGING_SETTINGS_KV_ID"

[[env.preview.kv_namespaces]]
binding  = "STANDORTE_KV"
id       = "REPLACE_WITH_STAGING_STANDORTE_KV_ID"
